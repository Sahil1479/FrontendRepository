<!--
  COMPONENT: Password Input
  FILE: components/password-input/password-input.html
  ─────────────────────────────────────────
  Dependencies: textbox.css · textbox.js · password-input.css · password-input.js

  JS API:
    UIPassword.validate(fieldEl, { required, minLength })
    UIPassword.getValue(fieldEl)   → raw (untrimmed) string
    UIPassword.show(fieldEl) / hide(fieldEl)
    UIPassword.setError / clearError
-->

<div class="ui-field ui-field--pw" data-field data-pw-field>
  <label class="ui-field__label" for="field-password">
    Password <span class="ui-field__req" aria-hidden="true">*</span>
  </label>
  <div class="ui-field__ctrl">
    <input
      class="ui-field__input"
      type="password"
      id="field-password"
      name="password"
      placeholder="Enter your password"
      autocomplete="current-password"
      aria-required="true"
      aria-describedby="field-password-err"
    />
    <button type="button" class="ui-pw-btn" aria-label="Show password" data-pw-toggle>
      <!-- Eye open -->
      <svg class="ui-pw-icon ui-pw-icon--on" width="18" height="18" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
      <!-- Eye off -->
      <svg class="ui-pw-icon ui-pw-icon--off" width="18" height="18" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
        <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
        <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
        <line x1="2" x2="22" y1="2" y2="22"/>
      </svg>
    </button>
  </div>
  <span class="ui-field__err" id="field-password-err" role="alert" aria-live="polite"></span>
</div>
